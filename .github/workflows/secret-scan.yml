name: Secret history scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository files and all Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout all branches and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every reachable commit on every fetched branch
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/path" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --log-opts="--full-history --all" /path

      - name: Scan current repository files
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/path" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact /path
